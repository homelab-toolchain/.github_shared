name: Build Mobile App (Flutter)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      release-build:
        type: boolean
        required: false
        default: false
      analyze-code:
        type: boolean
        required: false
        default: false
      execute-tests:
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  checks: write
  id-token: write
  pull-requests: read

jobs:
  flutter_test:
    name: Run Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: 'stable'
      - run: flutter pub get
      - if: ${{ inputs.analyze-code }}
        run: flutter analyze
      - if: ${{ inputs.execute-tests }}
        run: flutter test

  build_ios:
    name: Build for iOS
    needs: [flutter_test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter clean
      - run: |
          flutter build ios --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r app.ipa Payload
          ls -n
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ipa
          path: build/ios/iphoneos/app.ipa

  build_android:
    name: Build for Android
    needs: [flutter_test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter clean
      - run: flutter build apk --debug
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk
          path: build/app/outputs/apk/debug/app-debug.apk

  release_assets:
    name: Publish Build APK/IPA to GitHub Release
    if: ${{ inputs.release-build }}
    needs: [build_ios, build_android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-apk
          path: dist

      - name: Download iOS Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-ipa
          path: dist

      - name: Rename Outputs
        run: |
          if [ -f "dist/app-debug.apk" ]; then mv dist/app-debug.apk dist/${{ inputs.app-name }}.apk; fi
          if [ -f "dist/app.ipa" ]; then mv dist/app.ipa dist/${{ inputs.app-name }}.ipa; fi
          ls -la dist

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            dist/${{ inputs.app-name }}.apk
            dist/${{ inputs.app-name }}.ipa